name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  themes:
    name: themes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: node themes/validate.mjs
      - run: make pi-links-test

  extension:
    name: ${{ matrix.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: goal
            testDependencies: "uikit"
          - extension: plan
            testDependencies: "goal ast-grep uikit"
          - extension: lsp
            testDependencies: "uikit"
          - extension: uikit
            testDependencies: ""
          - extension: hashline
            testDependencies: "plan lsp rg uikit"
          - extension: request
            testDependencies: "goal uikit"
          - extension: rg
            testDependencies: "uikit"
          - extension: todo
            testDependencies: "goal plan request uikit"
          - extension: jaron
            testDependencies: "uikit"
          - extension: diffreport
            testDependencies: "uikit"
          - extension: telemetry
            testDependencies: ""
          - extension: enforce
            testDependencies: "plan"
          - extension: notify
            testDependencies: ""
          - extension: doclint
            testDependencies: "uikit"
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - run: npm ci
      - if: matrix.testDependencies != ''
        run: |
          for dependency in ${{ matrix.testDependencies }}; do
            (cd "../$dependency" && npm ci)
          done
      - run: npm run check
      - run: npm test

  ast-grep-native:
    name: ast-grep (${{ matrix.tuple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tuple: darwin-arm64
            os: macos-15
          - tuple: darwin-x64
            os: macos-15-intel
          - tuple: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - tuple: linux-x64-gnu
            os: ubuntu-24.04
          - tuple: win32-x64-msvc
            os: windows-2025
    defaults:
      run:
        working-directory: ast-grep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: ast-grep/package-lock.json
      - run: npm ci
        working-directory: uikit
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          PI_AST_GREP_EXPECT_TUPLE: ${{ matrix.tuple }}

  ast-grep-release:
    name: ast-grep packed Pi smoke
    needs: ast-grep-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ast-grep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: ast-grep/package-lock.json
      - run: npm ci
        working-directory: uikit
      - run: npm ci
      - run: npm run release-smoke
