name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  themes:
    name: themes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: node themes/validate.mjs

  extension:
    name: ${{ matrix.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extension: [goal, plan, lsp, request, rg]
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
