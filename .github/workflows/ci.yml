name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  themes:
    name: themes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: node themes/validate.mjs
      - run: make pi-links-test

  extension:
    name: ${{ matrix.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: goal
            testDependencies: ""
          - extension: plan
            testDependencies: goal
          - extension: lsp
            testDependencies: ""
          - extension: hashline
            testDependencies: "plan lsp rg"
          - extension: request
            testDependencies: goal
          - extension: rg
            testDependencies: ""
          - extension: todo
            testDependencies: "goal plan request"
          - extension: promptline-editor
            testDependencies: ""
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - run: npm ci
      - if: matrix.testDependencies != ''
        run: |
          for dependency in ${{ matrix.testDependencies }}; do
            (cd "../$dependency" && npm ci)
          done
      - run: npm run check
      - run: npm test
